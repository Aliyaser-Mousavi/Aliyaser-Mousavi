name: Update GitHub stats cards

on:
  schedule:
    - cron: "0 3 * * *" # Daily at 03:00 UTC
  workflow_dispatch: # Allows manual runs from the Actions tab

permissions:
  contents: write # Required so the action can commit the generated SVG files

concurrency:
  group: github-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub statistics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Aliyaser-Mousavi
          filename: github-stats.svg
          template: classic
          base: header, activity, community, repositories
          config_bg: 111315
          config_color: D18B52
          config_text: A6AAA5

      - name: Generate most-used languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Aliyaser-Mousavi
          filename: top-languages.svg
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 6
          config_bg: 111315
          config_color: D18B52
          config_text: A6AAA5
